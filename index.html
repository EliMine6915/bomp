<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bomp – Todo App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="notification-container" id="notificationContainer"></div>
    <a href="settings" class="settings-button hidden" id="settingsButton" title="Settings" aria-label="Settings">
        <i class="ph ph-gear-six"></i>
    </a>

    <div class="app">
        <div class="header">
            <h1>bomp</h1>
            <p class="tagline" id="tagline">Manage your tasks with elegance</p>
        </div>

        <div class="auth-card" id="authCard">
            <div class="auth-form">
                <div class="auth-toggle">
                    <button id="toggleLoginTab" class="toggle-tab active">Sign In</button>
                    <button id="toggleRegisterTab" class="toggle-tab">Register</button>
                </div>

                <h2 id="authTitle" style="margin-top: 10px;">Welcome Back</h2>

                <div class="input-group hidden" id="nameGroup">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your name" autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password" required>
                </div>

                <div class="auth-buttons">
                    <button id="submitAuthBtn" class="btn btn-primary" style="width: 100%;">
                        <i class="ph ph-sign-in"></i>
                        <span id="submitAuthText">Sign In</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="todo-list" id="todoList"></div>
    </div>

    <div class="input-container hidden" id="inputContainer">
        <div class="input-wrapper">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button class="add-btn" id="addBtn" title="Add task">
                <i class="ph ph-plus"></i>
            </button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>

</body>
</html>
