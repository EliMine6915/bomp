<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bomp – Todo App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Instrument Serif Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="notification-container" id="notificationContainer"></div>

    <div class="app">
        <div class="header">
            <h1>bomp</h1>
            <p class="tagline">Manage your tasks with elegance</p>
        </div>

        <div class="auth-card" id="authCard">
            <div class="auth-form">
                <h2>Welcome</h2>
                
                <div class="input-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="auth-buttons">
                    <button id="loginBtn" class="btn btn-primary">
                        <i class="ph ph-sign-in"></i>
                        Sign In
                    </button>
                    <button id="registerBtn" class="btn btn-secondary">
                        <i class="ph ph-user-plus"></i>
                        Register
                    </button>
                </div>

                <div class="auth-hint">
                    <p>New here? Create an account to get started.</p>
                </div>
            </div>
        </div>

        <div class="user-bar hidden" id="userBar">
            <div class="user-info">
                <i class="ph ph-user-circle"></i>
                <span id="userEmail"></span>
            </div>
            <button id="logoutBtn" class="btn btn-icon" title="Sign Out">
                <i class="ph ph-sign-out"></i>
            </button>
        </div>

        <div class="todo-list" id="todoList"></div>
    </div>

    <div class="input-container hidden" id="inputContainer">
        <div class="input-wrapper">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button class="add-btn" id="addBtn" title="Add task">
                <i class="ph ph-plus"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
