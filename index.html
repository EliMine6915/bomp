<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bomp – Todo App</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="notification-container" id="notificationContainer"></div>

    <div class="app">
        <div class="header">
            <h1>bomp</h1>
            <p class="tagline">Manage your tasks with elegance</p>
        </div>

        <div class="auth-card" id="authCard">
            <div class="auth-form">
                <div class="auth-toggle">
                    <button id="toggleLoginTab" class="toggle-tab active">Sign In</button>
                    <button id="toggleRegisterTab" class="toggle-tab">Register</button>
                </div>

                <h2 id="authTitle" style="margin-top: 10px;">Welcome Back</h2>

                <div class="input-group hidden" id="nameGroup">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your name" autocomplete="name">
                </div>

                <div class="input-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="auth-buttons">
                    <button id="submitAuthBtn" class="btn btn-primary" style="width: 100%;">
                        <i class="ph ph-paper-plane-tilt"></i>
                        <span id="submitAuthText">Send Code</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="auth-card hidden" id="verificationCard">
            <div class="auth-form">
                <div style="text-align: center; margin-bottom: 24px;">
                    <i class="ph ph-envelope-open" style="font-size: 48px; color: var(--accent); margin-bottom: 12px; display: block;"></i>
                    <h2 style="margin-bottom: 8px;">Check Your Email</h2>
                    <p style="color: var(--text-secondary); font-size: 14px;">
                        We've sent an 8-digit verification code to:<br>
                        <strong id="verificationEmail" style="color: var(--accent);"></strong>
                    </p>
                </div>

                <div class="input-group" style="margin-bottom: 20px;">
                    <label for="otpCode">Enter 8-digit Code</label>
                    <input type="text" id="otpCode" placeholder="12345678" style="text-align: center; font-size: 20px; letter-spacing: 4px;" autocomplete="one-time-code">
                </div>

                <button id="verifyOtpBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">
                    <i class="ph ph-check-circle"></i>
                    Verify & Continue
                </button>

                <button id="backToAuthBtn" class="btn btn-secondary" style="width: 100%;">
                    <i class="ph ph-arrow-left"></i>
                    Back
                </button>

                <div class="auth-hint" style="margin-top: 16px;">
                    <p id="resendHint">Didn't receive a code? <button id="resendBtn" style="background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit; font-size: inherit;">Resend code</button></p>
                </div>
            </div>
        </div>

        <div class="user-bar hidden" id="userBar">
            <div class="user-info">
                <i class="ph ph-user-circle"></i>
                <div class="user-info-text">
                    <span id="userName"></span>
                    <span id="userEmail"></span>
                </div>
            </div>
            <button id="logoutBtn" class="btn btn-icon" title="Sign Out">
                <i class="ph ph-sign-out"></i>
            </button>
        </div>

        <div class="todo-list" id="todoList"></div>
    </div>

    <div class="input-container hidden" id="inputContainer">
        <div class="input-wrapper">
            <input
                type="text"
                id="todoInput"
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button class="add-btn" id="addBtn" title="Add task">
                <i class="ph ph-plus"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
